schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Conventions: follow `docs/constitution/` — principles, patterns, technologies,
  documentation. Read its four index READMEs before creating artifacts. This
  block adds only what is specific to this product.
  (Restated because it is critical and easily got wrong: pnpm for everything —
  install, scripts, the relay worker. Never npm or yarn.)

  Product: RSS Reader — a local-first RSS reader delivered as an installable PWA.
  Everything (feeds, folder hierarchy, entries, read/bookmark state) is stored
  on the device in IndexedDB via Dexie, in the `rss-reader-pwa` database. There is
  no server and no account; the app must work fully offline once loaded.

  Core capabilities:
  - Add RSS feeds (URL + optional title + target folder).
  - A navigation tree of folders and feeds arranged in an arbitrary hierarchy,
    reordered and re-parented by drag and drop (including dropping to top level).
    Deleting a folder reparents its children; deleting a feed removes its entries.
  - Selecting a node shows every entry beneath it (a folder aggregates all feeds
    under it, recursively). Library shortcuts: All Entries, Unread, Bookmarks.
  - Per-entry read/unread state and bookmarking.
  - A bookmark is implicitly tagged with its feed's full hierarchy path
    (each ancestor folder name plus the feed name).
  - Bookmarks view supports search by keyword (title/snippet/tags) combined with
    tag-chip filters (AND semantics across selected tags).
  - JSON and CSV export, and JSON/CSV import for backup and restore.
  - Keyboard shortcuts: J/K navigate, B bookmark, U toggle unread, N new feed,
    / focus bookmark search.

  Data model (two Dexie tables, primary key `id` on both):
  - nodes: { id, type: 'folder' | 'feed', name, parentId (null = root), collapsed,
    url?, fetchedAt? }; indexed on parentId.
  - entries: { id, feedId, title, author, link, guid, publishedAt, snippet, body,
    read, marked }; indexed on feedId, publishedAt, [feedId+publishedAt],
    [read+publishedAt], [marked+publishedAt], read, marked, guid.
  - `read` and `marked` persist as 0/1 (IndexedDB cannot index a boolean) and are
    mapped to booleans at the repository boundary in `src/lib/db/rows.ts`.
  - The UI never holds the whole library: `src/lib/db/repository.ts` is the only
    read/write seam, entry lists page incrementally, and counts are indexed
    `count()` queries. See docs/adr/0001-store-the-library-in-indexeddb-via-dexie.md.

  Deliberate exceptions to the constitution defaults:
  - One server-side piece: a minimal, stateless Cloudflare Worker feed relay
    (`relay/`) that fetches feed XML to work around browser CORS. It stores
    nothing and holds no user data — a scoped exception to "no backend".
  - E2E uses Serenity/JS as the Screenplay implementation
    (`patterns/screenplay.md` suggests starting hand-rolled).

  Project specifics:
  - Native build scripts (esbuild, workerd, sharp) are approved via `allowBuilds`
    in `pnpm-workspace.yaml`.
  - The reference design in `RSS reader design/` is a React component (class
    extending DCLogic) rendered via a design-canvas runtime — treat it as the
    visual and behavioral spec, and port it to idiomatic TS/React (function
    components + hooks) rather than reproducing the DCLogic base class.
  - Deployment: the built static app (Vite `dist/`) goes to Cloudflare Pages. The
    relay stays a separate standalone Worker (`relay/`, `wrangler deploy`) — not
    folded into Pages Functions. `VITE_RELAY_URL` is set at build time to the
    deployed relay's origin. In dev, Vite proxies `/relay` to a local
    `wrangler dev`.

  Design system: "Industry" (in `RSS reader design/_ds/.../styles.css`).
  - Steel-blue accent (#5980a6) on a light technical ground (#f2f2f3),
    text #1d1f20. Barlow Condensed headings over Barlow body.
  - Consume design tokens only (var(--color-*), --font-*, --space-*,
    --radius-*, --shadow-*); never hard-code hex, font names, or raw px the
    tokens already carry.
  - Wireframe aesthetic: square corners, hairline borders, `.blueprint` frames
    with `<i class="corner …">` registration marks; the primary button is the
    one solid accent fill. Lucide icons at stroke-width 1.5.
  - Themed interaction states (accent-ramp hover/pressed, 2px accent
    :focus-visible ring); no browser-default focus rings.

# Per-artifact rules (optional)
rules:
  proposal:
    - State how the change behaves offline and what it persists to the local
      database.
    - Call out any change to the nodes/entries data shape, the Dexie schema
      version, and the forward-only upgrade path.
  tasks:
    - Include a task to verify export/import round-trips after data-model changes.
    - Cover behavior with Vitest (units/components) and, for user-facing flows,
      Playwright acceptance tests in the Screenplay Pattern (Serenity/JS) — see
      `docs/constitution/patterns/screenplay.md`.

# Per-operation guidance (optional)
operations:
  apply:
    guidance:
      - Use Industry design tokens; do not introduce colors, fonts, or spacing
        outside the token scales.
  archive:
    guidance:
      - Confirm data persists across reload and that the PWA still works offline.
